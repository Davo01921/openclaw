name: Catalogue integrity CI
on:
  push:
    paths: ['nta-inventory-state/**', '.github/workflows/catalogue-ci.yml']
  pull_request:
    paths: ['nta-inventory-state/**', '.github/workflows/catalogue-ci.yml']
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -B -m unittest discover -s nta-inventory-state/tests -v
      - run: python -B nta-inventory-state/scripts/dry_run.py
