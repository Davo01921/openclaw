name: Death loss CI
on:
  push:
    paths: ['nta-death-loss-order/**', '.github/workflows/death-loss-ci.yml']
  pull_request:
    paths: ['nta-death-loss-order/**', '.github/workflows/death-loss-ci.yml']
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s nta-death-loss-order/tests -q
      - run: python nta-death-loss-order/scripts/dry_run.py
