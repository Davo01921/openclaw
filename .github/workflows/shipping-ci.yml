name: Shipping fulfilment CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  fulfilment:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -B -m unittest discover -s nta-shipping-fulfilment/tests -v
      - run: |
          python -B nta-shipping-fulfilment/scripts/dry_run.py
          python -B nta-shopify-write-verifier/scripts/dry_run.py
          python -B nta-shopify-fulfilment-writer/scripts/dry_run.py
          python -B nta-shopify-fulfilment-writer/scripts/adapter_dry_run.py
          python -B nta-shopify-fulfilment-auditor/scripts/dry_run.py
          python -B nta-shopify-fulfilment-auditor/scripts/effect_dry_run.py
