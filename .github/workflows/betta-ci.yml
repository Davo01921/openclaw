name: Betta workflow CI

on:
  push:
    paths:
      - 'nta-betta-picture-processing-v2/**'
      - '.github/workflows/betta-ci.yml'
  pull_request:
    paths:
      - 'nta-betta-picture-processing-v2/**'
      - '.github/workflows/betta-ci.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile Betta scripts
        run: python -m py_compile nta-betta-picture-processing-v2/scripts/*.py
      - name: Run Betta tests
        run: python -m unittest discover -s nta-betta-picture-processing-v2/tests -p 'test_*.py' -v
